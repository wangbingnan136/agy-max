name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22']
        include:
          - os: windows-latest
            node: '24'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run repository security baseline check
        run: npm run security:check

      - name: Smoke test Windows PowerShell installer & uninstaller
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ciHome = Join-Path $env:RUNNER_TEMP "agy-ci-home-$PID"
          New-Item -ItemType Directory -Force -Path (Join-Path $ciHome '.gemini\config') | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $ciHome '.gemini\config\config.json'), '{ "plugins": { "other": { "enabled": true } } }', [System.Text.UTF8Encoding]::new($true))
          $plan = .\install.ps1 --home $ciHome --dry-run --json | ConvertFrom-Json
          if (-not $plan.dryRun) { throw 'Expected dryRun=true' }
          $installed = .\install.ps1 --home $ciHome --json | ConvertFrom-Json
          if (-not (Test-Path -LiteralPath (Join-Path $installed.destination 'plugin.json'))) { throw 'Plugin not installed' }
          $removed = .\uninstall.ps1 --home $ciHome --json | ConvertFrom-Json
          if (-not $removed.removed) { throw 'Plugin not removed' }

      - name: Verify release package build
        run: node scripts/build-release.mjs
